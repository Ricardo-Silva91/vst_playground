name: Build VST

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      vst_name:
        description: 'VST to build (folder name, e.g. pitch_wobble)'
        required: true
        type: choice
        options:
          - reverse_reverb
          - pitch_wobble
          - through_the_wall
          - drum_smash
          - break_scientist
          - choir_box
          - lizard_suite
          - lizard_tape
      platforms:
        description: 'Platforms to build'
        required: true
        type: choice
        default: 'mac+windows'
        options:
          - mac
          - windows
          - mac+windows

permissions:
  contents: write

jobs:
  # ── Detect which VSTs to build ───────────────────────────────────────────
  # Push: every plugin whose folder changed in the push (all of them when
  # shared/ or the JUCE submodule changed). Markdown-only changes don't build.
  # Manual: the plugin and platforms picked in the form.
  detect:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.parse.outputs.plugins }}
      build_mac: ${{ steps.parse.outputs.build_mac }}
      build_windows: ${{ steps.parse.outputs.build_windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find plugins to build
        id: parse
        env:
          EVENT: ${{ github.event_name }}
          VST: ${{ github.event.inputs.vst_name }}
          PLATFORMS: ${{ github.event.inputs.platforms }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            PLUGINS="$VST"
            [[ "$PLATFORMS" == *mac* ]]     && MAC=true || MAC=false
            [[ "$PLATFORMS" == *windows* ]] && WIN=true || WIN=false
          else
            MAC=true
            WIN=true
            ALL=$(for d in */Source/PluginProcessor.cpp; do echo "${d%%/*}"; done)
            if git cat-file -e "$BEFORE" 2>/dev/null; then
              CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -v '\.md$' || true)
            else
              echo "Previous commit $BEFORE not available — building everything"
              CHANGED="shared/"
            fi
            echo "Changed files:"; echo "$CHANGED"
            if echo "$CHANGED" | grep -qE '^(shared/|JUCE$)'; then
              PLUGINS="$ALL"
            else
              PLUGINS=$(for p in $ALL; do if echo "$CHANGED" | grep -q "^$p/"; then echo "$p"; fi; done)
            fi
          fi
          JSON=$(printf '%s\n' $PLUGINS | jq -R . | jq -sc 'map(select(length > 0))')
          echo "Building: $JSON (mac=$MAC, windows=$WIN)"
          echo "plugins=$JSON"     >> $GITHUB_OUTPUT
          echo "build_mac=$MAC"    >> $GITHUB_OUTPUT
          echo "build_windows=$WIN" >> $GITHUB_OUTPUT

  # ── Windows build ─────────────────────────────────────────────────────────
  build-windows:
    needs: detect
    if: needs.detect.outputs.plugins != '[]' && needs.detect.outputs.build_windows == 'true'
    strategy:
      fail-fast: false
      matrix:
        vst: ${{ fromJSON(needs.detect.outputs.plugins) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        working-directory: ${{ matrix.vst }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: ${{ matrix.vst }}
        run: cmake --build build --config Release

      - name: Zip VST3 bundle (Windows)
        working-directory: ${{ matrix.vst }}
        shell: bash
        run: |
          cd build
          VST3_PATH=$(find . -name "*.vst3" -type d | head -n 1)
          ZIP_NAME=$(basename "$VST3_PATH" | tr ' ' '_')_Windows.zip
          7z a "$ZIP_NAME" "$VST3_PATH"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload VST3 artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.vst }}-VST3-Windows
          path: ${{ matrix.vst }}/build/*_Windows.zip

  # ── macOS build ───────────────────────────────────────────────────────────
  build-mac:
    needs: detect
    if: needs.detect.outputs.plugins != '[]' && needs.detect.outputs.build_mac == 'true'
    strategy:
      fail-fast: false
      matrix:
        vst: ${{ fromJSON(needs.detect.outputs.plugins) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        working-directory: ${{ matrix.vst }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: ${{ matrix.vst }}
        run: cmake --build build --config Release

      - name: Zip VST3 bundle (preserve macOS bundle structure)
        working-directory: ${{ matrix.vst }}
        run: |
          cd build
          VST3_PATH=$(find . -name "*.vst3" -type d | head -n 1)
          ZIP_NAME=$(basename "$VST3_PATH" | tr ' ' '_')_Mac.zip
          zip -r "$ZIP_NAME" "$VST3_PATH"

      - name: Upload VST3 artifact (Mac)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.vst }}-VST3-Mac
          path: ${{ matrix.vst }}/build/*_Mac.zip

  # ── Publish release ───────────────────────────────────────────────────────
  publish:
    needs: [detect, build-mac, build-windows]
    # One release per plugin, from whichever of its platform builds succeeded
    if: always() && !cancelled() && needs.detect.result == 'success' && needs.detect.outputs.plugins != '[]'
    strategy:
      fail-fast: false
      matrix:
        vst: ${{ fromJSON(needs.detect.outputs.plugins) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts for this VST
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.vst }}-VST3-*
          path: release-assets
          merge-multiple: true

      - name: Check a build succeeded
        run: ls release-assets/*.zip

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.vst }}-latest
          name: "${{ matrix.vst }} (latest)"
          body: "Latest automated build of **${{ matrix.vst }}**."
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
