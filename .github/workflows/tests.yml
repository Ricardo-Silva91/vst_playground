name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # JUCE on Linux needs X11/GL/audio headers to compile (runtime display not needed)
      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxext-dev \
            libgl1-mesa-dev \
            libasound2-dev

      - name: Configure
        run: cmake -B tests/build -S tests -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build tests/build --parallel

      - name: Test
        working-directory: tests/build
        run: ctest --output-on-failure --parallel 4
